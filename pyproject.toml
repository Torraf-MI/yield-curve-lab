[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-curve-lab"
version = "0.1.0"
description = "Curve dei tassi BTP e Bund (Nelson-Siegel e Svensson), analisi ricco/caro, key rate duration, PCA, scenari di spread, VaR storico, copertura con Bund e immunizzazione di un obiettivo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["yield curve", "nelson-siegel", "svensson", "btp", "bund", "duration", "key rate duration", "immunization", "fixed income"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
yield-curve-lab = "yield_curve_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yield_curve_lab = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
